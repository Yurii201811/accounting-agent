name: Bug report
description: Report a reproducible problem using synthetic data only.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include vulnerabilities, credentials, real client data, private
        documents, bank details, or course material. Security reports follow
        SECURITY.md and GitHub private vulnerability reporting.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, using a minimal synthetic example?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Include deterministic steps and sanitized output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or revision
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed secrets, personal data, client data, and private source material.
          required: true
