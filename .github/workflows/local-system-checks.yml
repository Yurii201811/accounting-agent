name: Local accounting system checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  synthetic-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify synthetic release
        run: python scripts/verify_release.py
      - name: Build installable package
        run: python -m pip wheel --no-deps . --wheel-dir .local/wheels
