title = "Accounting Agent secret-scanning policy"

[extend]
useDefault = true

[[allowlists]]
description = "Ignore generated and dependency artifacts; repository source remains scanned"
paths = [
  '''(^|/)(\.artifacts|\.git|\.local|\.mypy_cache|\.pytest_cache|\.ruff_cache|\.venv|__pycache__|build|dist|htmlcov|mutants|node_modules|playwright-report|test-results|venv)(/|$)''',
  '''(^|/)\.coverage(\..*)?$''',
  '''\.py[co]$''',
]

[[allowlists]]
description = "Exact synthetic idempotency fixture in execution-attempt tests"
condition = "AND"
paths = ['''^tests/test_execution_attempts\.py$''']
regexTarget = "secret"
regexes = ['''^idempotency-1$''']
