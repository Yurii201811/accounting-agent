[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "accounting-agent"
version = "1.0.0"
description = "Sweden-first, provider-neutral accounting automation foundation."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
accounting-agent = "accounting_agent.cli:main"

[tool.setuptools.package-data]
accounting_agent = ["static/*.css", "static/*.svg", "static/*.txt", "static/*.html", "static/*.js"]

[tool.setuptools.packages.find]
include = ["accounting_agent*"]

[tool.unittest]
start-dir = "tests"
